name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages always serves "index.html" at the site root, but the
      # working file keeps its descriptive name so it stays easy to find in
      # an editor. Copy it into the published output under the name Pages
      # expects, rather than renaming the source file itself.
      - name: Build site
        run: |
          mkdir -p _site
          cp "bells n barz (main file).html" _site/index.html
          cp -r css _site/css
          cp -r js _site/js
          # Favicons, PWA manifest + icon (Add to Home Screen), the service worker the
          # Fasting timer's alerts need, and the printable questionnaire
          # linked from Meal Plan. All referenced with relative paths, since
          # Pages serves this site under /Bells-N-Barz/, not the domain root.
          cp manifest.json icon.svg icon-192.png icon-512.png apple-touch-icon.png favicon.svg favicon.ico sw.js _site/
          cp -r docs _site/docs
          # Cache-bust css/ and js/ links with this commit's id (the page
          # uses ?v=__BUILD__ as a placeholder).
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
